services:
  jobmatcher-api:
    build: .
    container_name: jobmatcher_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
      - MIN_MATCH_SCORE=70
      - PDF_PATH=/app/CV_ZAOUI_ANASS.pdf
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=zaouiazaziop@gmail.com
      - SMTP_FROM=zaouiazaziop@gmail.com
      - AUTO_APPLY_SEND=true
      - AUTO_APPLY_MAX=10
      - AUTO_APPLY_DELAY_SEC=25
      - MIN_APPLY_SCORE=80
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  jobmatcher-n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: jobmatcher_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Africa/Casablanca
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - jobmatcher-api

volumes:
  n8n_data:
